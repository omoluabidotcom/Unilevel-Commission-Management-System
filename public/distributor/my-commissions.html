<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CommissionHub — Commission History</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #1a6ef5;
      --blue-light: #e8f0fe;
      --green:      #16a34a;
      --orange:     #ea580c;
      --text-primary:   #111827;
      --text-secondary: #6b7280;
      --text-muted:     #9ca3af;
      --border:         #e5e7eb;
      --bg:             #f9fafb;
      --white:          #ffffff;
      --sidebar-w:      240px;
      --radius:         12px;
      --shadow:         0 1px 4px rgba(0,0,0,.07), 0 0 1px rgba(0,0,0,.06);
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); display: flex; min-height: 100vh; font-size: 14px; }

    /* ── SIDEBAR ── */
    .sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; z-index: 100; padding: 22px 14px 30px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; margin-bottom: 28px; }
    .brand-icon { width: 36px; height: 36px; background: var(--blue); border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
    .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-secondary); font-weight: 500; font-size: 14px; transition: background .15s, color .15s; text-decoration: none; user-select: none; }
    .nav-item:hover { background: var(--bg); color: var(--text-primary); }
    .nav-item.active { background: var(--blue); color: #fff; }
    .nav-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
    .nav-item.logout { color: var(--red); }
    .nav-item.logout:hover { background: #fee2e2; color: var(--red); }

    /* ── MAIN ── */
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }

    /* ── TOPBAR ── */
    .topbar { background: var(--white); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .topbar-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .notif-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--white); display: grid; place-items: center; cursor: pointer; transition: border-color .15s; }
    .notif-btn:hover { border-color: var(--blue); }
    .notif-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; border: 2px solid #fff; }
    .avatar { width: 36px; height: 36px; background: var(--blue); border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
    .user-pill { display: flex; align-items: center; gap: 9px; cursor: pointer; }
    .user-info .name { font-weight: 600; font-size: 13px; line-height: 1.2; }
    .user-info .role { font-size: 11px; color: var(--text-muted); }

    /* ── CONTENT ── */
    .content { padding: 26px 28px; display: flex; flex-direction: column; gap: 22px; }

    /* ── STAT GRID ── */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; animation: fadeUp .3s both; }
    .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; transition: box-shadow .2s, transform .2s; }
    .stat-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.09); transform: translateY(-1px); }
    .stat-left { display: flex; flex-direction: column; }
    .stat-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -.6px; margin-bottom: 6px; line-height: 1; }
    .stat-sub { font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .stat-sub.green  { color: var(--green); }
    .stat-sub.blue   { color: var(--blue); }
    .stat-sub.orange { color: var(--orange); }
    .stat-icon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
    .stat-icon.green  { background: #dcfce7; }
    .stat-icon.blue   { background: #dbeafe; }
    .stat-icon.orange { background: #fff7ed; }

    /* ── TABLE CARD ── */
    .table-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; animation: fadeUp .35s .06s both; }
    .table-header { padding: 20px 24px 16px; }
    .table-title { font-size: 16px; font-weight: 700; letter-spacing: -.25px; }

    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #f8fafc; border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); }
    thead th { text-align: left; padding: 11px 22px; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: .6px; text-transform: uppercase; white-space: nowrap; cursor: pointer; user-select: none; }
    thead th:hover { color: var(--text-primary); }
    thead th .si { margin-left: 4px; opacity: .35; display: inline-block; transition: opacity .15s; }
    thead th.sort-asc .si, thead th.sort-desc .si { opacity: 1; color: var(--blue); }
    thead th.sort-desc .si { transform: rotate(180deg); }

    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 16px 22px; font-size: 14px; vertical-align: middle; }

    .earned-amount { color: var(--green); font-weight: 600; font-size: 14.5px; }
    .paid-amount   { font-weight: 500; }

    /* BADGES */
    .badge { display: inline-flex; align-items: center; padding: 4px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 500; }
    .badge.paid     { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .badge.pending  { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .badge.approved { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

    /* ANIMATIONS */
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
    tbody tr { animation: fadeUp .2s both; }
    tbody tr:nth-child(1){ animation-delay:.04s; }
    tbody tr:nth-child(2){ animation-delay:.07s; }
    tbody tr:nth-child(3){ animation-delay:.10s; }
    tbody tr:nth-child(4){ animation-delay:.13s; }
    tbody tr:nth-child(5){ animation-delay:.16s; }
  </style>
</head>
<body>

<!-- ══════════ SIDEBAR ══════════ -->

  <div class="brand">

    </div>
    <span class="brand-name">CommissionHub</span>
  </div>
  <nav class="nav">
    <a class="nav-item" href="dashboard.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>

    </a>
    <a class="nav-item" href="my-downlines.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      My Downlines
    </a>
    <a class="nav-item active" href="#">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Commission History
    </a>
    <a class="nav-item" href="notifications.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Notifications
    </a>
    <a class="nav-item" href="profile.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
    <hr class="nav-divider"/>
    <a class="nav-item logout" href="#" onclick="confirmLogout(event)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </a>
  </nav>
</aside>

<!-- ══════════ MAIN ══════════ -->
<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <h1>Commission History</h1>
    </div>
    <div class="topbar-right">
      <button class="notif-btn">
        <div class="notif-dot"></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <div class="user-pill">
        <div class="avatar" id="topbarAvatar">JD</div>
        <div class="user-info">
          <div class="name" id="topbarName">John Doe</div>
          <div class="role">Distributor</div>
        </div>
      </div>
    </div>
  </header>

  <main class="content">

    <!-- STAT CARDS -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-left">
          <div class="stat-label">Total Earned</div>
          <div class="stat-value" id="statTotalEarned">—</div>
          <div class="stat-sub green">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
            All time
          </div>
        </div>
        <div class="stat-icon green">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-left">
          <div class="stat-label">Total Paid</div>
          <div class="stat-value" id="statTotalPaid">—</div>
          <div class="stat-sub blue">Received</div>
        </div>
        <div class="stat-icon blue">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-left">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="statPending">—</div>
          <div class="stat-sub orange">Awaiting payment</div>
        </div>
        <div class="stat-icon orange">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
      </div>
    </div>

    <!-- TABLE CARD -->
    <div class="table-card">
      <div class="table-header">
        <h2 class="table-title">Monthly Commission Breakdown</h2>
      </div>
      <table>
        <thead>
        <tr>
          <th data-col="month">Month <span class="si">↑</span></th>
          <th data-col="earned">Commission Earned <span class="si">↑</span></th>
          <th data-col="paid">Amount Paid <span class="si">↑</span></th>
          <th data-col="status">Status <span class="si">↑</span></th>
        </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

  </main>
</div>

<script src="../js/currency.js"></script>
<script src="../js/utils.js"></script>
<script>
  var commissions = [];

  var sortState = { col: 'month', dir: 'desc' };

  function fmt(n){ return typeof AppCurrency !== 'undefined' ? AppCurrency.fmt(n) : '$'+parseFloat(n||0).toFixed(2); }
  function cap(s){ return s ? s[0].toUpperCase()+s.slice(1) : ''; }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render(){
    var data = commissions.slice().sort(function(a, b){
      var va, vb;
      if(sortState.col === 'month')  { va = a.sortKey; vb = b.sortKey; }
      else if(sortState.col === 'earned') { va = a.earned;  vb = b.earned; }
      else if(sortState.col === 'paid')   { va = a.paid;    vb = b.paid; }
      else if(sortState.col === 'status') { va = a.status;  vb = b.status; }
      if(va < vb) return sortState.dir === 'asc' ? -1 : 1;
      if(va > vb) return sortState.dir === 'asc' ?  1 : -1;
      return 0;
    });

    var tbody = document.getElementById('tableBody');
    if(!data.length){
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:#9ca3af;">No commission records yet.</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(function(c, i){
      var paidAmt = c.status === 'paid' ? c.earned : c.paid;
      return '<tr style="animation-delay:'+(i*30)+'ms">'
        + '<td>' + esc(c.month) + '</td>'
        + '<td><span class="earned-amount">' + fmt(c.earned) + '</span></td>'
        + '<td><span class="paid-amount">'   + fmt(paidAmt)  + '</span></td>'
        + '<td><span class="badge ' + c.status + '">' + cap(c.status) + '</span></td>'
        + '</tr>';
    }).join('');
  }

  document.querySelectorAll('thead th[data-col]').forEach(function(th){
    th.addEventListener('click', function(){
      var col = th.dataset.col;
      var dir = (sortState.col === col && sortState.dir === 'asc') ? 'desc' : 'asc';
      sortState = { col: col, dir: dir };
      document.querySelectorAll('thead th').forEach(function(t){ t.classList.remove('sort-asc','sort-desc'); });
      th.classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
      render();
    });
  });

  // set initial sort indicator
  document.querySelector('thead th[data-col="month"]').classList.add('sort-desc');

  async function loadCommissions(){
    try {
      try { await AppCurrency.load(); } catch(e) { console.warn('Currency load failed:', e); }

      var data = await window.AppUtils.safeFetch('/api/commissions/me');
      var raw  = data.commissions || [];
      console.log('commissions from DB:', raw.length, raw);

      // Group DB records by period (YYYY-MM) — multiple rows per month get merged
      var grouped = {};
      raw.forEach(function(r){
        var period = r.period || 'unknown';
        if(!grouped[period]){
          grouped[period] = { period: period, earned: 0, paid: 0, status: r.status || 'pending' };
        }
        var amt = Number(r.totalCommission || 0);
        grouped[period].earned += amt;
        if(r.status === 'paid') grouped[period].paid += amt;
        // If any record in month is pending, month is pending; all paid = paid
        if(r.status === 'pending' || r.status === 'approved'){
          grouped[period].status = r.status;
        }
      });

      commissions = Object.values(grouped).map(function(g){
        var period = g.period;
        var label  = period;
        if(period.length === 7){ // YYYY-MM
          var d = new Date(period + '-01');
          label = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }
        return {
          month:   label,
          sortKey: period,
          earned:  g.earned,
          paid:    g.paid,
          status:  g.status,
        };
      });

      // Stats
      var totalEarned  = commissions.reduce(function(a,c){ return a + c.earned; }, 0);
      var totalPaid    = commissions.filter(function(c){ return c.status === 'paid'; })
                                    .reduce(function(a,c){ return a + c.earned; }, 0);
      var totalPending = commissions.filter(function(c){ return c.status === 'pending' || c.status === 'approved'; })
                                    .reduce(function(a,c){ return a + c.earned; }, 0);

      document.getElementById('statTotalEarned').textContent = fmt(totalEarned);
      document.getElementById('statTotalPaid').textContent   = fmt(totalPaid);
      document.getElementById('statPending').textContent     = fmt(totalPending);

      // Topbar
      var localUser = window.AppUtils.getLocalUser();
      if(localUser){
        var name = localUser.name || localUser.email || '';
        var ini  = name.split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
        document.getElementById('topbarName').textContent   = name;
        document.getElementById('topbarAvatar').textContent = ini;
      }

      render();
    } catch(e) {
      console.error('loadCommissions error:', e);
      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="4" style="text-align:center;padding:30px;color:#dc2626;">Failed to load: ' + e.message + '</td></tr>';
    }
  }

  window.addEventListener('DOMContentLoaded', loadCommissions);

  function confirmLogout(e){
    e.preventDefault();
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '../index.html';
  }
</script>
</body>
</html>

  .topbar-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .notif-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(&#45;&#45;border); background: var(&#45;&#45;white); display: grid; place-items: center; cursor: pointer; transition: border-color .15s; }
  .notif-btn:hover { border-color: var(&#45;&#45;blue); }
  .notif-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; border: 2px solid #fff; }
  .avatar { width: 36px; height: 36px; background: var(&#45;&#45;blue); border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
  .user-pill { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .user-info .name { font-weight: 600; font-size: 13px; line-height: 1.2; }
  .user-info .role { font-size: 11px; color: var(&#45;&#45;text-muted); }

  /* ── CONTENT ── */
  .content { padding: 26px 28px; display: flex; flex-direction: column; gap: 22px; }

  /* ── STAT GRID ── */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; animation: fadeUp .3s both; }
  .stat-card { background: var(&#45;&#45;white); border: 1px solid var(&#45;&#45;border); border-radius: var(&#45;&#45;radius); padding: 22px 24px; box-shadow: var(&#45;&#45;shadow); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; transition: box-shadow .2s, transform .2s; }
  .stat-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.09); transform: translateY(-1px); }
  .stat-left { display: flex; flex-direction: column; }
  .stat-label { font-size: 13px; color: var(&#45;&#45;text-secondary); font-weight: 500; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -.6px; margin-bottom: 6px; line-height: 1; }
  .stat-sub { font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
  .stat-sub.green  { color: var(&#45;&#45;green); }
  .stat-sub.blue   { color: var(&#45;&#45;blue); }
  .stat-sub.orange { color: var(&#45;&#45;orange); }
  .stat-icon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
  .stat-icon.green  { background: #dcfce7; }
  .stat-icon.blue   { background: #dbeafe; }
  .stat-icon.orange { background: #fff7ed; }

  /* ── TABLE CARD ── */
  .table-card { background: var(&#45;&#45;white); border: 1px solid var(&#45;&#45;border); border-radius: var(&#45;&#45;radius); box-shadow: var(&#45;&#45;shadow); overflow: hidden; animation: fadeUp .35s .06s both; }
  .table-header { padding: 20px 24px 16px; }
  .table-title { font-size: 16px; font-weight: 700; letter-spacing: -.25px; }

  table { width: 100%; border-collapse: collapse; }
  thead tr { background: #f8fafc; border-bottom: 1px solid var(&#45;&#45;border); border-top: 1px solid var(&#45;&#45;border); }
  thead th { text-align: left; padding: 11px 22px; font-size: 11px; font-weight: 600; color: var(&#45;&#45;text-muted); letter-spacing: .6px; text-transform: uppercase; white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(&#45;&#45;text-primary); }
  thead th .si { margin-left: 4px; opacity: .35; display: inline-block; transition: opacity .15s; }
  thead th.sort-asc .si, thead th.sort-desc .si { opacity: 1; color: var(&#45;&#45;blue); }
  thead th.sort-desc .si { transform: rotate(180deg); }

  tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .12s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f8fafc; }
  tbody td { padding: 16px 22px; font-size: 14px; vertical-align: middle; }

  .earned-amount { color: var(&#45;&#45;green); font-weight: 600; font-size: 14.5px; }
  .paid-amount   { font-weight: 500; }

  /* BADGES */
  .badge { display: inline-flex; align-items: center; padding: 4px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 500; }
  .badge.paid     { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
  .badge.pending  { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
  .badge.approved { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

  /* ANIMATIONS */
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
  tbody tr { animation: fadeUp .2s both; }
  tbody tr:nth-child(1){ animation-delay:.04s; }
  tbody tr:nth-child(2){ animation-delay:.07s; }
  tbody tr:nth-child(3){ animation-delay:.10s; }
  tbody tr:nth-child(4){ animation-delay:.13s; }
  tbody tr:nth-child(5){ animation-delay:.16s; }
</style>

<script>
var commissions = [
  { month: 'March 2026',    sortKey: '2026-03', earned: 54.00, paid: 0.00,  status: 'pending'  },
  { month: 'February 2026', sortKey: '2026-02', earned: 60.00, paid: 60.00, status: 'paid'     },
  { month: 'January 2026',  sortKey: '2026-01', earned: 45.00, paid: 45.00, status: 'paid'     },
  { month: 'December 2025', sortKey: '2025-12', earned: 52.00, paid: 52.00, status: 'paid'     },
  { month: 'November 2025', sortKey: '2025-11', earned: 48.00, paid: 48.00, status: 'paid'     },
];

var sortState = { col: 'month', dir: 'desc' };

function fmt(n){ return '$' + parseFloat(n).toFixed(2); }
function cap(s){ return s ? s[0].toUpperCase()+s.slice(1) : ''; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  var data = commissions.slice().sort(function(a, b){
    var va, vb;
    if(sortState.col === 'month')  { va = a.sortKey; vb = b.sortKey; }
    else if(sortState.col === 'earned') { va = a.earned;  vb = b.earned; }
    else if(sortState.col === 'paid')   { va = a.paid;    vb = b.paid; }
    else if(sortState.col === 'status') { va = a.status;  vb = b.status; }
    if(va < vb) return sortState.dir === 'asc' ? -1 : 1;
    if(va > vb) return sortState.dir === 'asc' ?  1 : -1;
    return 0;
  });

  document.getElementById('tableBody').innerHTML = data.map(function(c, i){
    return '<tr style="animation-delay:'+(i*30)+'ms">'
      + '<td>' + esc(c.month) + '</td>'
      + '<td><span class="earned-amount">' + fmt(c.earned) + '</span></td>'
      + '<td><span class="paid-amount">'   + fmt(c.paid)   + '</span></td>'
      + '<td><span class="badge ' + c.status + '">' + cap(c.status) + '</span></td>'
      + '</tr>';
  }).join('');
}

document.querySelectorAll('thead th[data-col]').forEach(function(th){
  th.addEventListener('click', function(){
    var col = th.dataset.col;
    var dir = (sortState.col === col && sortState.dir === 'asc') ? 'desc' : 'asc';
    sortState = { col: col, dir: dir };
    document.querySelectorAll('thead th').forEach(function(t){ t.classList.remove('sort-asc','sort-desc'); });
    th.classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
    render();
  });
});

// set initial sort indicator
document.querySelector('thead th[data-col="month"]').classList.add('sort-desc');
render();

function confirmLogout(e){
  e.preventDefault();
  window.location.href = '../index.html';
}
</script>
