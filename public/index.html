<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommissionHub — Sign In</title>
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo" aria-hidden="true"></div>
        <h1>CommissionHub</h1>
      </div>

      <h2>Welcome back</h2>
      <p class="login-subtitle">Sign in to your account to continue</p>

      <form id="loginForm" class="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="admin@example.com" />

        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
          <button type="button" class="pass-eye" id="togglePassword" aria-label="Toggle password visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <button type="submit" class="primary">Sign in</button>

        <div class="login-footer">
          <a href="/register.html" class="forgot">Register</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function(){
      var field = document.getElementById('password');
      var toggle = document.getElementById('togglePassword');
      var openIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      var closedIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      toggle.addEventListener('click', function(){
        if(field.type === 'text'){
          field.type = 'password';
          toggle.innerHTML = closedIcon;
          return;
        }
        field.type = 'text';
        toggle.innerHTML = openIcon;
      });
    })();
  </script>
</body>
</html>
