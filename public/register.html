<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommissionHub — Register</title>
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card register-card">
      <div class="login-brand">
        <div class="login-logo" aria-hidden="true"></div>
        <h1>CommissionHub</h1>
      </div>

      <h2>Create your account</h2>
      <p class="login-subtitle">Join our distribution network as a distributor</p>

      <form id="registerForm" class="login-form">
        <label for="fullName">Full Name</label>
        <input id="fullName" name="fullName" type="text" required placeholder="John Doe" />

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required placeholder="john@example.com" />

        <label for="phone">Phone Number <span class="optional">(optional)</span></label>
        <input id="phone" name="phone" type="tel" placeholder="+1 (555) 123-4567" />

        <label for="sponsorId">Sponsor ID <span class="optional">(optional)</span></label>
        <input id="sponsorId" name="sponsorId" type="text" placeholder="If you have a sponsor, enter their ID" />

        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" name="password" type="password" required placeholder="••••••••" />
          <button type="button" class="pass-eye" id="togglePassword" aria-label="Toggle password visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <label for="confirmPassword">Confirm Password</label>
        <div class="password-field">
          <input id="confirmPassword" name="confirmPassword" type="password" required placeholder="••••••••" />
          <button type="button" class="pass-eye" id="toggleConfirmPassword" aria-label="Toggle password visibility">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <button type="submit" class="primary">Create Account</button>

        <div class="login-footer">
          <p>Already have an account? <a href="/" class="forgot">Sign in</a></p>
        </div>
      </form>
    </div>
  </div>

  <style>
    .register-card {
      max-width: 500px;
    }
    .optional {
      font-size: 0.85em;
      color: #666;
      font-weight: normal;
    }
  </style>

  <script src="js/utils.js"></script>
  <script src="js/register.js"></script>
  <script>
    (function(){
      var setupPasswordToggle = function(fieldId, toggleId) {
        var field = document.getElementById(fieldId);
        var toggle = document.getElementById(toggleId);
        var openIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        var closedIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
        toggle.addEventListener('click', function(){
          if(field.type === 'text'){
            field.type = 'password';
            toggle.innerHTML = closedIcon;
            return;
          }
          field.type = 'text';
          toggle.innerHTML = openIcon;
        });
      };
      setupPasswordToggle('password', 'togglePassword');
      setupPasswordToggle('confirmPassword', 'toggleConfirmPassword');
    })();
  </script>
</body>
</html>
